<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Microsoft YaHei, sans-serif">
  <rect width="800" height="500" fill="#fafbfc"/>
  
  <!-- 标题 -->
  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">泵浦选型决策树</text>
  <text x="400" y="55" text-anchor="middle" font-size="13" fill="#6b7280">从介质特性出发，逐步确定适合的泵浦类型</text>
  
  <!-- 开始 -->
  <rect x="340" y="80" width="120" height="40" rx="5" fill="#3b82f6"/>
  <text x="400" y="105" text-anchor="middle" font-size="16" fill="white" font-weight="bold">开始</text>
  
  <!-- 箭头 -->
  <line x1="400" y1="120" x2="400" y2="150" stroke="#9ca3af" stroke-width="2"/>
  <polygon points="395,150 405,150 400,160" fill="#9ca3af"/>
  
  <!-- 问题 1 -->
  <rect x="270" y="160" width="260" height="50" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="400" y="190" text-anchor="middle" font-size="14" fill="#92400e">介质有毒/易燃/强腐蚀?</text>
  
  <!-- 答案分支 -->
  <line x1="330" y1="210" x2="200" y2="240" stroke="#9ca3af" stroke-width="2"/>
  <text x="260" y="225" font-size="13" fill="#10b981" font-weight="bold">YES</text>
  <polygon points="195,240 205,240 200,250" fill="#9ca3af"/>
  
  <line x1="470" y1="210" x2="600" y2="240" stroke="#9ca3af" stroke-width="2"/>
  <text x="530" y="225" font-size="13" fill="#ef4444" font-weight="bold">NO</text>
  <polygon points="595,240 605,240 600,250" fill="#9ca3af"/>
  
  <!-- 磁力泵 -->
  <rect x="80" y="240" width="180" height="60" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="170" y="265" text-anchor="middle" font-size="16" fill="#1d4ed8" font-weight="bold">磁力泵</text>
  <text x="170" y="285" text-anchor="middle" font-size="11" fill="#6b7280">强腐蚀/易燃易爆</text>
  
  <!-- 问题 2 -->
  <rect x="450" y="240" width="260" height="50" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="580" y="270" text-anchor="middle" font-size="13" fill="#92400e">需要精确定量添加?</text>
  
  <!-- 计量泵 -->
  <rect x="470" y="330" width="180" height="60" rx="5" fill="#fed7aa" stroke="#f59e0b" stroke-width="2"/>
  <text x="560" y="355" text-anchor="middle" font-size="16" fill="#b45309" font-weight="bold">计量泵</text>
  <text x="560" y="375" text-anchor="middle" font-size="11" fill="#6b7280">精确投加</text>
  
  <!-- 问题 3 -->
  <rect x="450" y="330" width="260" height="50" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="580" y="360" text-anchor="middle" font-size="13" fill="#92400e">含固体/高粘度?</text>
  
  <line x1="540" y1="290" x2="510" y2="330" stroke="#9ca3af" stroke-width="2"/>
  <polygon points="500,330 510,330 505,340" fill="#9ca3af"/>
  
  <line x1="620" y1="290" x2="670" y2="330" stroke="#9ca3af" stroke-width="2"/>
  <polygon points="665,330 675,330 670,340" fill="#9ca3af"/>
  
  <!-- 隔膜泵 -->
  <rect x="420" y="430" width="180" height="60" rx="5" fill="#fef3c7" stroke="#fbbf24" stroke-width="2"/>
  <text x="510" y="455" text-anchor="middle" font-size="16" fill="#92400e" font-weight="bold">隔膜泵</text>
  <text x="510" y="475" text-anchor="middle" font-size="11" fill="#6b7280">含颗粒/高粘度</text>
  
  <!-- 离心泵 -->
  <rect x="620" y="430" width="180" height="60" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="710" y="455" text-anchor="middle" font-size="16" fill="#047857" font-weight="bold">离心泵</text>
  <text x="710" y="475" text-anchor="middle" font-size="11" fill="#6b7280">清水/循环水</text>
  
  <!-- 底部 -->
  <text x="400" y="490" text-anchor="middle" font-size="11" fill="#9ca3af">© 苏州弓海贸易 | www.szkhai.com.cn</text>
</svg>